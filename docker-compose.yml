services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-wagering_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wagering_pass}
      POSTGRES_DB: ${DB_NAME:-wagering_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wagering_user} -d ${DB_NAME:-wagering_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.0
    container_name: wagering_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./docker/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    container_name: wagering_postgres_test
    profiles: ["integration"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: wagering_test_user
      POSTGRES_PASSWORD: wagering_test_pass
      POSTGRES_DB: wagering_test_db
    ports:
      - "5433:5432"
    volumes:
      - pgtestdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering_test_user -d wagering_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack-test:
    image: localstack/localstack:3.0
    container_name: wagering_localstack_test
    profiles: ["integration"]
    ports:
      - "4567:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack_test_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  localstack_data:
  pgtestdata:
  localstack_test_data:
